<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Water PCG · Flowing Heightfield Water</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --deep-water: #061116;
        --instrument-panel: rgb(5 19 25 / 82%);
        --instrument-line: rgb(156 215 221 / 18%);
        --foam-ink: #d7edef;
        --water-muted: #83a5aa;
        --current-cyan: #58c8cf;
        --fault-coral: #ff8a78;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        color: var(--foam-ink);
        background: var(--deep-water);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      #canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      #heightfield-hud {
        position: fixed;
        top: 14px;
        left: 14px;
        z-index: 3;
        width: min(350px, calc(100vw - 112px));
        padding: 12px 14px 11px;
        border: 1px solid var(--instrument-line);
        border-radius: 4px;
        background: var(--instrument-panel);
        backdrop-filter: blur(8px);
        pointer-events: none;
      }

      .hud-heading {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--instrument-line);
      }

      .hud-heading strong {
        color: var(--foam-ink);
        font-size: 12px;
        font-weight: 650;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      #heightfield-status {
        color: var(--current-cyan);
        font-size: 10px;
        letter-spacing: 0.04em;
      }

      #heightfield-status[data-state="error"] {
        color: var(--fault-coral);
      }

      #heightfield-metrics {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 5px 12px;
        margin: 9px 0 0;
      }

      #heightfield-metrics div {
        min-width: 0;
      }

      #heightfield-metrics dt {
        overflow: hidden;
        margin: 0 0 2px;
        color: var(--water-muted);
        font-size: 8px;
        letter-spacing: 0.06em;
        text-overflow: ellipsis;
        text-transform: uppercase;
        white-space: nowrap;
      }

      #heightfield-metrics dd {
        overflow: hidden;
        margin: 0;
        color: var(--foam-ink);
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #fixture-mark {
        position: fixed;
        left: 16px;
        bottom: 14px;
        z-index: 2;
        color: rgb(186 222 225 / 62%);
        font-size: 9px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        pointer-events: none;
      }

      .dg.ac {
        z-index: 4 !important;
      }
    </style>
  </head>
  <body>
    <aside id="heightfield-hud" aria-live="polite">
      <div class="hud-heading">
        <strong>Flow water field / 192 × 128</strong>
        <span id="heightfield-status" data-state="loading">compiling</span>
      </div>
      <dl id="heightfield-metrics">
        <div>
          <dt>bodies</dt>
          <dd data-metric="components">—</dd>
        </div>
        <div>
          <dt>chunks</dt>
          <dd data-metric="chunks">—</dd>
        </div>
        <div>
          <dt>vertices</dt>
          <dd data-metric="vertices">—</dd>
        </div>
        <div>
          <dt>triangles</dt>
          <dd data-metric="triangles">—</dd>
        </div>
        <div>
          <dt>atlas</dt>
          <dd data-metric="atlas">—</dd>
        </div>
        <div>
          <dt>waves</dt>
          <dd data-metric="waves">—</dd>
        </div>
        <div>
          <dt>uploads</dt>
          <dd data-metric="uploads">—</dd>
        </div>
        <div>
          <dt>quality</dt>
          <dd data-metric="quality">high</dd>
        </div>
      </dl>
    </aside>
    <div id="fixture-mark">flow-advected ripples · depth optics · bank foam</div>
    <canvas id="canvas"></canvas>
    <script type="module" src="../demo/heightfield/main.ts"></script>
  </body>
</html>
