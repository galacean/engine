<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Water PCG</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --deep-water: #041116;
        --instrument-panel: rgb(5 21 27 / 88%);
        --instrument-line: rgb(122 207 215 / 22%);
        --instrument-bay: rgb(3 17 23 / 70%);
        --instrument-bay-line: rgb(91 211 213 / 14%);
        --foam-ink: #e2f4f3;
        --water-muted: #83a8aa;
        --current-cyan: #5bd3d5;
        --ready-green: #8ee29a;
        --warning-amber: #f0bd68;
        --fault-coral: #ff8576;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        color: var(--foam-ink);
        background: var(--deep-water);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      #water-pcg-view,
      #canvas {
        width: 100%;
        height: 100%;
      }

      #canvas {
        display: block;
      }

      #example-bar {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 5;
        display: flex;
        align-items: flex-start;
        max-width: calc(100vw - 24px);
        gap: 8px;
        box-sizing: border-box;
        padding: 7px 8px 6px;
        overflow-x: auto;
        border: 1px solid rgb(122 207 215 / 14%);
        border-radius: 6px;
        background: linear-gradient(90deg, rgb(7 35 42 / 86%), rgb(2 13 19 / 78%)), rgb(0 0 0 / 74%);
        box-shadow:
          0 14px 40px rgb(0 0 0 / 26%),
          inset 0 1px rgb(255 255 255 / 3%);
        backdrop-filter: blur(12px);
        scrollbar-width: none;
      }

      #example-bar::-webkit-scrollbar {
        display: none;
      }

      .example-group {
        display: flex;
        flex-direction: column;
        flex: 0 0 auto;
        align-items: flex-start;
        gap: 2px;
      }

      .example-group + .example-group {
        padding-left: 8px;
        border-left: 1px solid rgb(122 207 215 / 18%);
      }

      .example-group-label {
        padding: 0 6px;
        color: var(--water-muted);
        font-size: 8px;
        letter-spacing: 0.16em;
        line-height: 13px;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .example-group-links {
        display: flex;
        align-items: center;
        gap: 2px;
      }

      .example-tab {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        height: 28px;
        padding: 0 10px;
        border: 0;
        border-radius: 2px;
        color: #c8c8c8;
        background: transparent;
        font:
          11px/28px ui-monospace,
          SFMono-Regular,
          Menlo,
          Monaco,
          Consolas,
          monospace;
        text-decoration: none;
        white-space: nowrap;
        cursor: pointer;
      }

      .example-tab:hover {
        color: #fff;
        background: rgb(91 211 213 / 10%);
      }

      .example-tab.is-active {
        color: #fff;
        background: rgb(27 116 127 / 56%);
        box-shadow: inset 0 -2px var(--current-cyan);
      }

      #case-intro {
        position: fixed;
        right: 16px;
        bottom: 14px;
        z-index: 2;
        display: grid;
        width: min(430px, calc(100vw - 32px));
        box-sizing: border-box;
        gap: 4px;
        padding: 10px 12px;
        border: 1px solid var(--instrument-line);
        border-radius: 5px;
        background: rgb(4 17 22 / 78%);
        box-shadow: 0 12px 36px rgb(0 0 0 / 24%);
        pointer-events: none;
        backdrop-filter: blur(8px);
      }

      #case-intro[data-interactive="true"] {
        pointer-events: auto;
      }

      #case-intro-title {
        color: var(--foam-ink);
        font-size: 11px;
        letter-spacing: 0.08em;
      }

      #case-intro-text {
        color: var(--water-muted);
        font-size: 9px;
        line-height: 1.5;
      }

      #feature-comparison {
        display: flex;
        align-items: center;
        gap: 5px;
        margin-top: 5px;
        padding-top: 8px;
        border-top: 1px solid var(--instrument-bay-line);
      }

      .feature-comparison-label,
      .feature-comparison-status {
        color: var(--water-muted);
        font-size: 8px;
        letter-spacing: 0.08em;
        white-space: nowrap;
      }

      .feature-comparison-status {
        margin-left: auto;
      }

      #feature-comparison button {
        min-height: 27px;
        padding: 0 8px;
        border: 1px solid var(--instrument-line);
        border-radius: 2px;
        color: var(--foam-ink);
        background: var(--instrument-bay);
        font: inherit;
        font-size: 9px;
        cursor: pointer;
      }

      #feature-comparison button:hover,
      #feature-comparison button[data-active="true"] {
        border-color: var(--current-cyan);
        color: #fff;
        background: rgb(25 112 122 / 66%);
      }

      #feature-comparison button:disabled {
        opacity: 0.45;
        cursor: wait;
      }

      html[data-water-pcg-group="docs"] #case-intro {
        display: none !important;
      }

      #heightfield-hud,
      #buoyancy-hud,
      #interactive-pool-hud,
      #water-optics-hud,
      #grasslands-water-hud {
        position: fixed;
        top: 74px;
        left: 14px;
        z-index: 3;
        box-sizing: border-box;
        padding: 12px 14px 11px;
        border: 1px solid var(--instrument-line);
        border-radius: 5px;
        background: var(--instrument-panel);
        box-shadow: 0 14px 45px rgb(0 0 0 / 28%);
        backdrop-filter: blur(10px);
      }

      #heightfield-hud {
        width: min(350px, calc(100vw - 28px));
        pointer-events: none;
      }

      #grasslands-water-hud {
        width: min(720px, calc(100vw - 28px));
        max-height: calc(100vh - 90px);
        overflow-y: auto;
      }

      #buoyancy-hud {
        width: min(430px, calc(100vw - 28px));
      }

      #interactive-pool-hud {
        width: min(520px, calc(100vw - 28px));
        max-height: calc(100vh - 90px);
        overflow-y: auto;
      }

      #water-optics-hud {
        width: min(620px, calc(100vw - 28px));
        max-height: calc(100vh - 72px);
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-gutter: stable;
      }

      .optics-control-groups {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin-top: 10px;
      }

      .optics-control-group {
        min-width: 0;
        padding: 8px;
        border: 1px solid var(--instrument-bay-line);
        border-radius: 4px;
        background: var(--instrument-bay);
      }

      .optics-control-group--wide {
        grid-column: 1 / -1;
      }

      .optics-control-group h2 {
        display: flex;
        align-items: center;
        gap: 7px;
        margin: 0 0 7px;
        color: var(--foam-ink);
        font-size: 9px;
        font-weight: 650;
        letter-spacing: 0.08em;
        line-height: 1;
        text-transform: uppercase;
      }

      .optics-control-group h2::after {
        width: 100%;
        height: 1px;
        background: var(--instrument-bay-line);
        content: "";
      }

      .optics-control-group h2 small {
        flex: 0 0 auto;
        color: var(--water-muted);
        font-size: 7px;
        font-weight: 500;
        letter-spacing: 0.05em;
      }

      .optics-control-group .hud-controls {
        gap: 5px;
        padding: 0;
      }

      .optics-control-group .hud-controls + .hud-controls {
        margin-top: 7px;
        padding-top: 7px;
        border-top: 1px solid var(--instrument-bay-line);
      }

      .optics-control-label {
        flex: 0 0 100%;
        color: var(--water-muted);
        font-size: 7px;
        letter-spacing: 0.07em;
        line-height: 1;
        text-transform: uppercase;
      }

      .optics-control-group select {
        min-width: 0;
        flex: 1 1 180px;
      }

      .optics-metrics-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 10px;
        padding-top: 9px;
        border-top: 1px solid var(--instrument-line);
        color: var(--water-muted);
        font-size: 8px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .optics-metrics-heading span:last-child {
        color: var(--ready-green);
        font-size: 7px;
      }

      .hud-heading,
      .hud-controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .hud-heading {
        padding-bottom: 9px;
        border-bottom: 1px solid var(--instrument-line);
      }

      .hud-heading strong {
        color: var(--foam-ink);
        font-size: 12px;
        font-weight: 650;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      #heightfield-status,
      #buoyancy-status,
      #interactive-pool-status,
      #water-optics-status,
      #grasslands-water-status {
        color: var(--current-cyan);
        font-size: 10px;
        letter-spacing: 0.04em;
      }

      #buoyancy-status {
        color: var(--warning-amber);
      }

      #buoyancy-status[data-state="ready"],
      #interactive-pool-status[data-state="ready"],
      #water-optics-status[data-state="ready"] {
        color: var(--ready-green);
      }

      #heightfield-status[data-state="error"],
      #buoyancy-status[data-state="error"],
      #interactive-pool-status[data-state="error"],
      #water-optics-status[data-state="error"],
      #grasslands-water-status[data-state="error"] {
        color: var(--fault-coral);
      }

      #grasslands-water-status[data-state="fallback"],
      #grasslands-water-status[data-state="loading"] {
        color: var(--warning-amber);
      }

      #grasslands-water-status[data-state="ready"] {
        color: var(--ready-green);
      }

      .hud-controls {
        justify-content: flex-start;
        flex-wrap: wrap;
        padding: 9px 0;
      }

      .hud-controls[hidden] {
        display: none;
      }

      .hud-controls button,
      .hud-controls select {
        padding: 5px 8px;
        border: 1px solid var(--instrument-line);
        border-radius: 3px;
        color: var(--water-muted);
        background: rgb(8 35 42 / 72%);
        font: inherit;
        font-size: 9px;
        letter-spacing: 0.04em;
      }

      .hud-controls button {
        cursor: pointer;
      }

      .hud-controls button:hover,
      .hud-controls button[data-active="true"] {
        border-color: var(--current-cyan);
        color: var(--foam-ink);
      }

      #water-optics-hud .hud-controls button[data-active="true"] {
        background: rgb(21 80 86 / 78%);
      }

      #water-optics-hud .hud-controls button:focus-visible,
      #water-optics-hud .hud-controls select:focus-visible {
        outline: 2px solid var(--current-cyan);
        outline-offset: 2px;
      }

      .hud-controls button:disabled {
        cursor: not-allowed;
        opacity: 0.42;
      }

      #heightfield-metrics,
      #buoyancy-metrics,
      #interactive-pool-metrics,
      #water-optics-metrics,
      #grasslands-water-metrics {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 7px 12px;
        margin: 9px 0 0;
      }

      #buoyancy-metrics {
        margin-top: 0;
      }

      #interactive-pool-metrics {
        margin-top: 9px;
      }

      #water-optics-metrics {
        margin-top: 9px;
      }

      #heightfield-metrics div,
      #buoyancy-metrics div,
      #interactive-pool-metrics div,
      #water-optics-metrics div,
      #grasslands-water-metrics div {
        min-width: 0;
      }

      #heightfield-metrics dt,
      #buoyancy-metrics dt,
      #interactive-pool-metrics dt,
      #water-optics-metrics dt,
      #grasslands-water-metrics dt {
        overflow: hidden;
        margin: 0 0 2px;
        color: var(--water-muted);
        font-size: 8px;
        letter-spacing: 0.06em;
        text-overflow: ellipsis;
        text-transform: uppercase;
        white-space: nowrap;
      }

      #heightfield-metrics dd,
      #buoyancy-metrics dd,
      #interactive-pool-metrics dd,
      #water-optics-metrics dd,
      #grasslands-water-metrics dd {
        overflow: hidden;
        margin: 0;
        color: var(--foam-ink);
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #fixture-mark,
      #buoyancy-legend {
        position: fixed;
        bottom: 14px;
        z-index: 2;
        color: rgb(190 229 228 / 64%);
        font-size: 9px;
        letter-spacing: 0.05em;
        pointer-events: none;
      }

      #fixture-mark {
        left: 16px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      html[data-water-pcg-runtime="grasslands"] #canvas {
        background: radial-gradient(circle at 50% 78%, rgb(45 112 117 / 42%), transparent 42%),
          linear-gradient(#17332e 0 42%, #071d25 42% 100%);
      }

      html[data-water-pcg-automation="true"][data-water-pcg-runtime="grasslands"] #example-bar,
      html[data-water-pcg-automation="true"][data-water-pcg-runtime="grasslands"] #case-intro,
      html[data-water-pcg-automation="true"][data-water-pcg-runtime="grasslands"] #grasslands-water-hud,
      html[data-water-pcg-automation="true"][data-water-pcg-runtime="grasslands"] #fixture-mark {
        display: none !important;
      }

      #buoyancy-legend {
        right: 15px;
      }

      .dg.ac {
        z-index: 4 !important;
      }

      html[data-water-pcg-kind="optics-lab"] .gl-perf {
        top: 56px !important;
        right: 14px !important;
        left: auto !important;
        z-index: 4 !important;
      }

      html[data-water-optics-screenshot="true"] #example-bar,
      html[data-water-optics-screenshot="true"] #case-intro,
      html[data-water-optics-screenshot="true"] #water-optics-hud,
      html[data-water-optics-screenshot="true"] #fixture-mark,
      html[data-water-optics-screenshot="true"] .gl-perf {
        display: none !important;
      }

      @media (max-width: 680px) {
        #case-intro {
          right: 8px;
          bottom: 8px;
          width: min(360px, calc(100vw - 16px));
        }

        #water-optics-hud {
          right: 8px;
          left: 8px;
          width: auto;
          max-height: calc(100dvh - 64px);
        }

        .optics-control-groups {
          grid-template-columns: minmax(0, 1fr);
        }

        .optics-control-group--wide {
          grid-column: auto;
        }

        #water-optics-metrics {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        #water-optics-hud .hud-controls button,
        #water-optics-hud .hud-controls select {
          min-height: 34px;
        }
      }

      @media (max-width: 360px) {
        #water-optics-metrics {
          grid-template-columns: minmax(0, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <nav id="example-bar" aria-label="Water PCG 案例"></nav>
    <aside id="case-intro" aria-live="polite">
      <strong id="case-intro-title"></strong>
      <span id="case-intro-text"></span>
    </aside>
    <main id="water-pcg-view"></main>

    <template id="water-pcg-river-template">
      <canvas id="canvas"></canvas>
    </template>

    <template id="water-pcg-ocean-template">
      <canvas id="canvas"></canvas>
    </template>

    <template id="water-pcg-heightfield-template">
      <aside id="heightfield-hud" data-water-debug-panel aria-live="polite">
        <div class="hud-heading">
          <strong>Flow water field / 192 × 128</strong>
          <span id="heightfield-status" data-state="loading">compiling</span>
        </div>
        <dl id="heightfield-metrics">
          <div>
            <dt>bodies</dt>
            <dd data-metric="components">—</dd>
          </div>
          <div>
            <dt>chunks</dt>
            <dd data-metric="chunks">—</dd>
          </div>
          <div>
            <dt>vertices</dt>
            <dd data-metric="vertices">—</dd>
          </div>
          <div>
            <dt>triangles</dt>
            <dd data-metric="triangles">—</dd>
          </div>
          <div>
            <dt>atlas</dt>
            <dd data-metric="atlas">—</dd>
          </div>
          <div>
            <dt>waves</dt>
            <dd data-metric="waves">—</dd>
          </div>
          <div>
            <dt>uploads</dt>
            <dd data-metric="uploads">—</dd>
          </div>
          <div>
            <dt>quality</dt>
            <dd data-metric="quality">high</dd>
          </div>
        </dl>
      </aside>
      <div id="fixture-mark">flow-advected ripples · depth optics · bank foam</div>
      <canvas id="canvas"></canvas>
    </template>

    <template id="water-pcg-grasslands-template">
      <aside id="grasslands-water-hud" data-water-debug-panel aria-label="Grasslands water diagnostics">
        <div class="hud-heading">
          <strong>Grasslands Water / Controlled Fixture</strong>
          <span id="grasslands-water-status" data-state="loading" role="status" aria-live="polite">initializing</span>
        </div>
        <div class="hud-controls" aria-label="Grasslands capture states">
          <button type="button" data-grasslands-capture-state="hero" data-active="true">Hero</button>
          <button type="button" data-grasslands-capture-state="detail-normal">Normal</button>
          <button type="button" data-grasslands-capture-state="refraction">Refraction</button>
          <button type="button" data-grasslands-capture-state="depth-color">Depth</button>
          <button type="button" data-grasslands-capture-state="contact-foam">Foam</button>
          <button type="button" data-grasslands-capture-state="coastal-alpha">Coastal</button>
          <button type="button" data-grasslands-capture-state="direct-specular">Specular</button>
          <button type="button" data-grasslands-capture-state="reflection">Reflection</button>
        </div>
        <div class="hud-controls" aria-label="Grasslands causal feature gates">
          <button type="button" data-grasslands-toggle="externalNormal" data-active="true">Normal A/B</button>
          <button type="button" data-grasslands-toggle="refraction" data-active="true">Refraction A/B</button>
          <button type="button" data-grasslands-toggle="depthColor" data-active="true">Depth A/B</button>
          <button type="button" data-grasslands-toggle="contactFoam" data-active="true">Foam A/B</button>
          <button type="button" data-grasslands-toggle="coastalAlpha" data-active="true">Coastal A/B</button>
          <button type="button" data-grasslands-toggle="directSpecular" data-active="true">Specular A/B</button>
          <button type="button" data-grasslands-toggle="reflection" data-active="true">Reflection A/B</button>
          <select data-grasslands-quality aria-label="Grasslands quality tier">
            <option value="high" selected>High</option>
            <option value="medium">Medium</option>
            <option value="low">Low fallback</option>
          </select>
          <button type="button" data-grasslands-reset>Reset Hero</button>
        </div>
        <dl id="grasslands-water-metrics">
          <div>
            <dt>runtime / preset</dt>
            <dd data-metric="identity">—</dd>
          </div>
          <div>
            <dt>quality</dt>
            <dd data-metric="quality">high</dd>
          </div>
          <div>
            <dt>capture / debug</dt>
            <dd data-metric="capture">hero / 0</dd>
          </div>
          <div>
            <dt>normal</dt>
            <dd data-metric="normal">—</dd>
          </div>
          <div>
            <dt>foam</dt>
            <dd data-metric="foam">—</dd>
          </div>
          <div>
            <dt>depth / opaque copies</dt>
            <dd data-metric="broker">—</dd>
          </div>
          <div>
            <dt>active runtime</dt>
            <dd data-metric="runtime-set">—</dd>
          </div>
          <div>
            <dt>mesh uploads</dt>
            <dd data-metric="uploads">—</dd>
          </div>
          <div>
            <dt>fixture hash</dt>
            <dd data-metric="fixture">—</dd>
          </div>
          <div>
            <dt>appearance hash</dt>
            <dd data-metric="appearance">—</dd>
          </div>
          <div>
            <dt>asset hash</dt>
            <dd data-metric="asset">—</dd>
          </div>
          <div>
            <dt>strict material</dt>
            <dd data-metric="ready">false</dd>
          </div>
        </dl>
      </aside>
      <div id="fixture-mark">public Showcase · Heightfield V1 · Surface Appearance V1 · analytic sky response</div>
      <canvas id="canvas"></canvas>
    </template>

    <template id="water-pcg-optics-lab-template">
      <aside id="water-optics-hud" data-water-debug-panel aria-label="Water Optics debug controls">
        <div class="hud-heading">
          <strong>Water Optics Lab / Fixed Golden Scene</strong>
          <span id="water-optics-status" data-state="loading" role="status" aria-live="polite">initializing</span>
        </div>
        <div class="optics-control-groups">
          <section class="optics-control-group" aria-labelledby="optics-quality-heading">
            <h2 id="optics-quality-heading">Quality <small>High default</small></h2>
            <div class="hud-controls">
              <button type="button" data-optics-tier="medium">Medium</button>
              <button type="button" data-optics-tier="high">High</button>
              <button type="button" data-optics-tier="experimental">Experimental</button>
            </div>
          </section>

          <section class="optics-control-group" aria-labelledby="optics-time-heading">
            <h2 id="optics-time-heading">Time &amp; Motion</h2>
            <div class="hud-controls">
              <button type="button" data-optics-freeze>Freeze time</button>
              <button type="button" data-optics-step>Step frame</button>
              <button type="button" data-optics-move-reflector>Move Reflector</button>
              <button type="button" data-optics-local-foam-mask>Local Foam Mask</button>
            </div>
          </section>

          <section class="optics-control-group optics-control-group--wide" aria-labelledby="optics-camera-heading">
            <h2 id="optics-camera-heading">Camera</h2>
            <div class="hud-controls">
              <button type="button" data-optics-move-camera>Auto Camera</button>
              <button
                type="button"
                data-optics-free-camera
                title="Drag on the scene to look; use WASD or arrow keys to move"
              >
                Free Camera
              </button>
              <button type="button" data-optics-camera-cut>Camera Cut</button>
            </div>
            <div class="hud-controls">
              <span class="optics-control-label">Fixed camera preset</span>
              <select data-optics-camera aria-label="Camera preset">
                <option value="overview">Overview</option>
                <option value="refraction-edge">Refraction Edge</option>
                <option value="depth-steps">Depth Steps</option>
