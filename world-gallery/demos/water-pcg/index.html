<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Water PCG</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #091014;
      }

      #canvas {
        width: 100vw;
        height: 100vh;
        display: block;
      }

      #example-bar {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 3;
        display: flex;
        gap: 4px;
        padding: 4px;
        border-radius: 3px;
        background: rgb(0 0 0 / 72%);
      }

      .example-tab {
        height: 28px;
        padding: 0 10px;
        border: 0;
        border-radius: 2px;
        color: #c8c8c8;
        background: transparent;
        font:
          12px/28px Arial,
          sans-serif;
        cursor: pointer;
      }

      .example-tab:hover {
        color: #fff;
        background: #333;
      }

      .example-tab.is-active {
        color: #fff;
        background: #2f6f9f;
      }

      .dg.ac {
        z-index: 2 !important;
      }
    </style>
  </head>
  <body>
    <div id="example-bar" role="tablist" aria-label="Water PCG examples"></div>
    <canvas id="canvas"></canvas>
    <script type="module" src="./demo/main.ts"></script>
  </body>
</html>
