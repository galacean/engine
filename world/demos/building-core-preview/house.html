<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>建筑核心层 · M2 房屋</title>
    <style>
      body {
        margin: 0;
        background: #1d2428;
        color: #e8ecea;
        font:
          14px/1.5 system-ui,
          "PingFang SC",
          sans-serif;
      }
      canvas {
        width: 100vw;
        height: 100vh;
        display: block;
      }
      aside {
        position: absolute;
        top: 16px;
        left: 16px;
        width: 320px;
        max-height: calc(100vh - 32px);
        overflow: auto;
        padding: 16px;
        background: #141a1dee;
        border: 1px solid #2c363b;
        border-radius: 10px;
        display: grid;
        gap: 12px;
      }
      h1 {
        font-size: 16px;
        margin: 0;
      }
      p {
        margin: 0;
        color: #a9b4af;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      button {
        font: inherit;
        padding: 5px 10px;
        border-radius: 6px;
        border: 1px solid #36434a;
        background: #222b30;
        color: inherit;
        cursor: pointer;
      }
      button[aria-pressed="true"] {
        background: #2f6fd6;
        border-color: #2f6fd6;
        color: #fff;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 6px;
      }
      li {
        display: grid;
        grid-template-columns: 20px 1fr;
        gap: 2px 6px;
      }
      li .d {
        grid-column: 2;
        color: #a9b4af;
        font:
          11.5px ui-monospace,
          Menlo,
          monospace;
        overflow-wrap: anywhere;
      }
      .ok {
        color: #5cc68b;
      }
      .bad {
        color: #ff8a80;
      }
      .wait {
        color: #a9b4af;
      }
      .label {
        position: absolute;
        padding: 2px 8px;
        border-radius: 4px;
        background: #141a1dcc;
        font-size: 13px;
        pointer-events: none;
        transform: translate(-50%, -100%);
        white-space: nowrap;
      }
      #ab {
        position: absolute;
        right: 16px;
        top: 16px;
        padding: 6px 12px;
        border-radius: 6px;
        background: #141a1dee;
        border: 1px solid #2c363b;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <aside>
      <h1>建筑核心层 · M2 房屋</h1>
      <p>
        同一套引擎、资产和渲染器。左边是线上房屋（原生砌筑）；右边是新架构房屋：墙砖由核心层的 masonryCourses 铺设，转角石由墙与墙的成角连接派生，屋顶、预览和其他部分仍来自线上。
      </p>
      <div class="row" id="cases"></div>
      <div class="row" id="modes">
        <button data-mode="side" aria-pressed="true">并排</button>
        <button data-mode="flip" aria-pressed="false">同位交替（空格切换）</button>
      </div>
      <ul id="checks">
        <li><span class="wait">…</span><span>加载中</span></li>
      </ul>
      <p>对比标准是观感相近，不要求逐字节一致。同位交替：两者放在同一位置，按空格切换。</p>
    </aside>
    <div id="ab" hidden></div>
    <script type="module" src="./house.ts"></script>
  </body>
</html>
