<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Integrated World</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        background: #101820;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        visibility: hidden;
      }

      body[data-ready="true"] canvas {
        visibility: visible;
      }

      html[data-acceptance-capture="canvas"] body > :not(#canvas) {
        visibility: hidden !important;
      }

      #loading-screen {
        position: fixed;
        z-index: 10000;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: white;
        background: #101820;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        pointer-events: none;
      }

      .loading-card {
        display: grid;
        width: min(420px, 86vw);
        gap: 12px;
      }

      .loading-heading {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: baseline;
      }

      .loading-heading strong {
        font-size: 15px;
      }

      #loading-percent {
        color: #8ff5d5;
        font-size: 13px;
      }

      .loading-track {
        height: 6px;
        overflow: hidden;
        border-radius: 999px;
        background: #263845;
      }

      #loading-bar {
        display: block;
        width: 0;
        height: 100%;
        border-radius: inherit;
        background: #62e6bf;
        transition: width 120ms linear;
      }

      #status {
        min-height: 20px;
        color: #9fb1bf;
        font-size: 12px;
        line-height: 1.5;
      }

      #loading-screen[data-state="error"] #loading-bar {
        background: #ff7c87;
      }
    </style>
  </head>
  <body data-ready="false">
    <canvas id="canvas" aria-hidden="true"></canvas>
    <div id="loading-screen" role="status" aria-live="polite" aria-atomic="true" data-state="loading">
      <div class="loading-card">
        <div class="loading-heading">
          <strong>Loading terrain</strong>
          <output id="loading-percent">0%</output>
        </div>
        <div class="loading-track" aria-hidden="true"><span id="loading-bar"></span></div>
        <div id="status">Loading project…</div>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
