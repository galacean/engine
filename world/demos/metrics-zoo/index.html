<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>米制白盒测试场</title><style>
*{box-sizing:border-box}body{margin:0;background:#102633;color:#dfebf0;font:14px system-ui}main{display:grid;grid-template-columns:290px 1fr;height:100vh;overflow:hidden}aside{min-height:0;padding:22px;overflow:auto;border-right:1px solid #375364}h1{font-size:24px}p{color:#a6bfcb;line-height:1.6}button,select,input{font:inherit;color:inherit;background:#1c3949;border:1px solid #4b6978;border-radius:5px;padding:9px}button{cursor:pointer;margin:4px 0}aside button{width:100%;text-align:left}label{display:flex;align-items:center;justify-content:space-between;margin:10px 0}input{width:95px}#viewport{position:relative;min-width:0;height:100vh}a{color:#87d5df}hr{border:0;border-top:1px solid #375364;margin:22px 0}
</style></head><body><main><aside><small>METRICS ZOO / 米制白盒</small><h1>用角色尺度体验</h1><p>1 格 = 1 米。地面保留 FBM；比较台使用水平基准面，避免噪声干扰尺寸测试。</p><div id="settings"></div><button id="overview">返回 45° 总览</button><hr><div id="stations"></div><p>WASD 行走，Shift 跑步，空格跳跃。点击画面锁定鼠标，Esc 解锁。跳跃与台阶参数是测试默认值。</p><a href="https://book.leveldesignbook.com/process/blockout/metrics#build-a-metrics-zoo-test-map">设计参考：Metrics Zoo</a></aside><section id="viewport" aria-label="米制白盒测试地图"></section></main><script type="module" src="./main.ts"></script></body></html>
