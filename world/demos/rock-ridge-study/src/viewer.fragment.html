<div id="rock-arrangement-study">
  <h3>Mountain peaks</h3>
  <div class="viz-controls">
    <label class="form-label">View
      <select class="form-select" id="rock-study-view">
        <option value="perspective">Oblique</option>
        <option value="side">Side</option>
        <option value="plan" selected>Plan</option>
        <option value="low">Low angle</option>
        <option value="close">Rock close-up</option>
        <option value="compare">Surface comparison</option>
      </select>
    </label>
    <label class="form-check"><input class="form-check-input" id="rock-study-guides" type="checkbox"><span class="form-check-label">Show layout</span></label>
  </div>
  <div class="viz-controls">
    <label class="form-label">Rock finish <select class="form-select" id="rock-study-finish"><option value="textured" selected>Atomic rock texture · triplanar</option><option value="stone">Procedural stone</option><option value="clay">Fractured clay</option><option value="original">Original clay</option></select></label>
  </div>
  <div class="viz-controls" id="rock-study-fractures">
    <label class="form-label" for="rock-study-fracture-depth">Fracture depth <output class="tabular-nums" id="rock-study-fracture-depth-value">140%</output>
      <input class="form-range" id="rock-study-fracture-depth" aria-label="Fracture depth" type="range" min="0" max="200" step="10" value="140">
    </label>
    <label class="form-label" for="rock-study-fracture-width">Fracture width <output class="tabular-nums" id="rock-study-fracture-width-value">160%</output>
      <input class="form-range" id="rock-study-fracture-width" aria-label="Fracture width" type="range" min="0" max="200" step="10" value="160">
    </label>
    <label class="form-label" for="rock-study-fracture-irregularity">Irregularity <output class="tabular-nums" id="rock-study-fracture-irregularity-value">180%</output>
      <input class="form-range" id="rock-study-fracture-irregularity" aria-label="Fracture irregularity" type="range" min="0" max="200" step="10" value="180">
    </label>
  </div>
  <div class="viz-row">
    <div id="rock-study-seed-controls"><div class="viz-row">
      <label class="form-label">Generation seed <input class="form-control" id="rock-study-seed" type="number" min="0" max="4294967295" step="1" value="480"></label>
      <button class="btn" type="button" id="rock-study-next-seed">Next seed</button>
    </div></div>
    <label class="form-label" for="rock-study-height">Height <output id="rock-study-height-value" for="rock-study-height" class="tabular-nums">100%</output>
      <input class="form-range" id="rock-study-height" aria-label="Height" type="range" min="25" max="200" step="5" value="100">
    </label>
  </div>
  <div id="rock-study-counts">
    <label class="form-check"><input class="form-check-input" id="rock-study-seeded-counts" type="checkbox" checked><span class="form-check-label">Seed controls counts</span></label>
    <div class="viz-controls">
      <label class="form-label" for="rock-study-peak-count">Main peaks <output class="tabular-nums" id="rock-study-peak-count-value">3</output>
        <input class="form-range" id="rock-study-peak-count" aria-label="Main peaks" type="range" min="1" max="5" step="1" value="3">
      </label>
      <label class="form-label" for="rock-study-branch-count">Side ridges <output class="tabular-nums" id="rock-study-branch-count-value">4</output>
        <input class="form-range" id="rock-study-branch-count" aria-label="Side ridges" type="range" min="3" max="8" step="1" value="4">
      </label>
    </div>
  </div>
  <div id="rock-study-authoring">
    <div class="viz-controls">
      <label class="form-label">Ridge source <select class="form-select" id="rock-study-mode"><option value="perlin">Perlin field</option><option value="direct" selected>Seeded graph</option></select></label>
      <label class="form-label" id="rock-study-surface-control">Surface <select class="form-select" id="rock-study-surface"><option value="rocks">Rock masses</option><option value="coarse">Coarse noise field</option><option value="detail">Detailed noise field</option></select></label>
    </div>
    <details id="rock-study-noise-controls">
      <summary class="text-small">Noise controls · <span id="rock-study-noise-summary"></span></summary>
      <div class="viz-controls">
        <label class="form-label">Base frequency <input class="form-control" id="rock-study-frequency" aria-label="Base frequency" type="number" min="1" max="4" step=".25" value="4"></label>
        <label class="form-label">Octaves <input class="form-control" id="rock-study-octaves" aria-label="Octaves" type="number" min="1" max="8" step="1" value="5"></label>
        <label class="form-label">Lacunarity <input class="form-control" id="rock-study-lacunarity" aria-label="Lacunarity" type="number" min="1" max="3" step=".25" value="2"></label>
        <label class="form-label">Persistence <input class="form-control" id="rock-study-persistence" aria-label="Persistence" type="number" min="0" max="1" step=".05" value=".85"></label>
      </div>
    </details>
  </div>
  <div id="rock-study-ridge-legend"><div class="viz-row text-small">
    <span><span class="rock-legend-line rock-legend-axis" aria-hidden="true"></span>Ridge network</span>
    <span id="rock-study-surface-legend"><span class="rock-legend-line rock-legend-crest" aria-hidden="true"></span>Rock surface</span>
  </div></div>
  <div class="rock-stage" id="rock-study-stage" role="img" aria-label="Procedural 3D mountain peaks. Change the seed to grow a new ridge network; drag to orbit.">
    <div class="rock-label-layer" id="rock-study-labels"></div>
    <div class="rock-comparison-labels text-small" id="rock-study-comparison" hidden><span>Straight cuts</span><span>Adjusted fractures</span></div>
    <div class="rock-scale text-small" id="rock-study-scale"><span></span><div>10 m</div></div>
  </div>
  <div class="viz-row text-small" aria-live="polite"><span id="rock-study-detail"></span></div>
  <div class="sr-only" id="rock-study-description"></div>
</div>
<style>
  #rock-arrangement-study {display:flex;flex-direction:column;gap:calc(var(--font-size-base)*.75)}
  #rock-arrangement-study [hidden] {display:none!important}
  #rock-arrangement-study .rock-stage {position:relative;width:100%;overflow:hidden;min-height:280px}
  #rock-arrangement-study canvas {display:block;width:100%;touch-action:none;cursor:grab}
  #rock-arrangement-study canvas:active {cursor:grabbing}
  #rock-arrangement-study .rock-label-layer {position:absolute;inset:0;pointer-events:none}
  #rock-arrangement-study .rock-comparison-labels {position:absolute;inset:0;pointer-events:none;color:var(--foreground)}
  #rock-arrangement-study .rock-comparison-labels span {position:absolute;top:8px;transform:translateX(-50%);white-space:nowrap}
  #rock-arrangement-study .rock-comparison-labels span:first-child {left:25%}
  #rock-arrangement-study .rock-comparison-labels span:last-child {left:75%}
  #rock-arrangement-study .rock-comparison-labels.stacked span {left:50%}
  #rock-arrangement-study .rock-comparison-labels.stacked span:last-child {top:calc(50% + 8px)}
  #rock-arrangement-study .rock-label {position:absolute;white-space:nowrap;color:var(--foreground);text-shadow:0 1px 2px var(--background),0 -1px 2px var(--background),1px 0 2px var(--background),-1px 0 2px var(--background)}
  #rock-arrangement-study .rock-scale {position:absolute;left:12px;bottom:8px;color:var(--foreground);pointer-events:none}
  #rock-arrangement-study .rock-scale span {display:block;height:5px;border:1px solid var(--foreground);border-top:0}
  #rock-arrangement-study .rock-legend-line {display:inline-block;width:24px;vertical-align:middle;margin-inline-end:6px}
  #rock-arrangement-study .rock-legend-axis {border-top:2px solid var(--blue)}
  #rock-arrangement-study .rock-legend-crest {border-top:2px solid var(--orange)}
</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script id="rock-study-data" type="application/json">__ROCK_STUDY_DATA__</script>
<script>
(()=>{
 __ROCK_RIDGE_GENERATOR__
 const DEMO_PRESET='seed-grown-mountain-v1';
 const root=document.getElementById('rock-arrangement-study');
 const stage=root.querySelector('#rock-study-stage'), labels=root.querySelector('#rock-study-labels');
 const comparisonLabels=root.querySelector('#rock-study-comparison');
 const viewSelect=root.querySelector('#rock-study-view'),guideInput=root.querySelector('#rock-study-guides');
 const detail=root.querySelector('#rock-study-detail'),description=root.querySelector('#rock-study-description'),scaleBar=root.querySelector('#rock-study-scale span');
 const seedInput=root.querySelector('#rock-study-seed'),nextSeed=root.querySelector('#rock-study-next-seed');
 const heightInput=root.querySelector('#rock-study-height'),heightValue=root.querySelector('#rock-study-height-value');
 const ridgeLegend=root.querySelector('#rock-study-ridge-legend');
 const finishInput=root.querySelector('#rock-study-finish');
 const fractureInputs=Object.fromEntries(Object.keys(FRACTURE_DEFAULTS).map(key=>[key,root.querySelector('#rock-study-fracture-'+key)]));
 const fractureOptions=()=>fractureSettings(Object.fromEntries(Object.entries(fractureInputs).map(([key,input])=>[key,Number(input.value)/100])));
 const fractureKey=()=>JSON.stringify(fractureOptions());
 function fractureLabels(){for(const [key,input]of Object.entries(fractureInputs)){root.querySelector('#rock-study-fracture-'+key+'-value').value=input.value+'%';input.setAttribute('aria-valuetext',input.value+' percent');}}
 const modeInput=root.querySelector('#rock-study-mode'),surfaceInput=root.querySelector('#rock-study-surface'),surfaceControl=root.querySelector('#rock-study-surface-control');
 const noiseControls=root.querySelector('#rock-study-noise-controls'),noiseSummary=root.querySelector('#rock-study-noise-summary');
 const noiseInputs=Object.fromEntries(Object.keys(PERLIN_DEFAULTS).map(key=>[key,root.querySelector('#rock-study-'+key)]));
 const noiseOptions=()=>Object.fromEntries(Object.entries(noiseInputs).map(([key,input])=>[key,Number(input.value)]));
 const authoringKey=()=>JSON.stringify({mode:modeInput.value,noise:noiseOptions()});
 const countsPanel=root.querySelector('#rock-study-counts'),seededCounts=root.querySelector('#rock-study-seeded-counts'),peakCountInput=root.querySelector('#rock-study-peak-count'),branchCountInput=root.querySelector('#rock-study-branch-count');
 const countOptions=()=>mountainCounts({seeded:seededCounts.checked,peaks:Number(peakCountInput.value),branches:Number(branchCountInput.value)});
 const countKey=()=>seededCounts.checked?'seeded':JSON.stringify(countOptions());
 function countLabels(){root.querySelector('#rock-study-peak-count-value').value=peakCountInput.value;root.querySelector('#rock-study-branch-count-value').value=branchCountInput.value;}
 const data=JSON.parse(document.getElementById('rock-study-data').textContent);
 if(typeof THREE==='undefined'){detail.textContent='The 3D renderer could not load.';detail.setAttribute('role','alert');return;}
 const T=THREE,scene=new T.Scene();
 const camera=new T.OrthographicCamera(-60,60,40,-40,.1,3000);
 let renderer;
 try {renderer=new T.WebGLRenderer({antialias:true,alpha:true});}
 catch(error){detail.textContent='WebGL is unavailable in this view.';detail.setAttribute('role','alert');return;}
 renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
 renderer.outputColorSpace=T.SRGBColorSpace;
 renderer.toneMapping=T.ACESFilmicToneMapping;
 renderer.toneMappingExposure=1.15;
 renderer.shadowMap.enabled=true;
 renderer.shadowMap.type=T.PCFSoftShadowMap;
 stage.insertBefore(renderer.domElement,labels);
 const atomicRockTextures=loadAtomicRockTextures(T,renderer.capabilities.getMaxAnisotropy(),()=>{if(current)render();},error=>{detail.textContent='The atomic rock textures could not load.';detail.setAttribute('role','alert');console.error(error);});
 const ambient=new T.HemisphereLight();ambient.intensity=2.4;scene.add(ambient);
 const sun=new T.DirectionalLight();sun.intensity=3.3;sun.position.set(-60,115,70);sun.castShadow=true;
 sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-120,right:120,top:120,bottom:-120,near:1,far:350});
 sun.shadow.bias=-.00025;sun.shadow.normalBias=.08;scene.add(sun);
 let baseGeometries={},activeGeometries={},geometryCache={},geometryMode='',baseSeed;
 function rockBuffer(g){
  const attributes=g.surface?creasedRockAttributes(g):g,geo=new T.BufferGeometry();
  geo.setAttribute('position',new T.Float32BufferAttribute(attributes.positions,3));geo.setAttribute('normal',new T.Float32BufferAttribute(attributes.normals,3));
  if(g.surface)geo.setAttribute('rockDetail',new T.Float32BufferAttribute(attributes.rockDetail,3));else geo.setIndex(g.indices);
  geo.computeBoundingSphere();return geo;
 }
 let current,world=new T.Group(),guideGroup=new T.Group(),target=new T.Vector3(),yaw=0,pitch=.45,span=100,width=700,height=450;
 const comparisonGroup=new T.Group(),previousBuffers=new Map();let comparisonMeshes=[],comparisonCorners=[],comparisonTarget=new T.Vector3(),adjustedBuffer,adjustedKey='';
 scene.add(world,guideGroup,comparisonGroup);
 let materials=[],terrainGeometry,guideGeometries=[],lastColors='',generatedKey='',generatedScene;
 let requestedKey='',requestedFlags,pendingOrbit,worker,workerJob,fallbackKernel;
 const fallbackCache={};
 let readyResolve;const workerReady=new Promise(resolve=>{readyResolve=resolve;});
 async function fallbackBuild(request){stage.dataset.generationBackend='main';fallbackKernel??=atomicRockKernel();await fallbackKernel.ready;return buildRuntimeMountain(fallbackKernel,request,fallbackCache);}
 function workerFailed(){
  worker?.terminate();worker=null;readyResolve();
  if(workerJob){const job=workerJob;workerJob=null;fallbackBuild(job.request).then(job.resolve,job.reject);}
 }
 try{
  const code=atomicRockKernel.toString()+'\n'+MOUNTAIN_WORKER_BODY,url=URL.createObjectURL(new Blob([code],{type:'text/javascript'}));
  worker=new Worker(url);URL.revokeObjectURL(url);
  worker.onmessage=({data:message})=>{
   if(message.ready){stage.dataset.generationBackend='worker';readyResolve();return;}
   if(message.fatal){workerFailed();return;}
   if(workerJob&&message.id===workerJob.request.id){const job=workerJob;workerJob=null;if(message.error)job.reject(new Error(message.error));else job.resolve(message.result);}
  };
  worker.onerror=workerFailed;
 }catch{readyResolve();}
 async function runBuild(request){await workerReady;return worker?new Promise((resolve,reject)=>{workerJob={request,resolve,reject};worker.postMessage(request);}):fallbackBuild(request);}
 function runtimeSettings(){
  const compare=viewSelect.value==='compare',counts=countOptions();
  return {seed:Number(seedInput.value)>>>0,mode:modeInput.value,noise:noiseOptions(),topology:counts.seeded?{seeded:true}:counts,
   fractures:compare?FRACTURE_DEFAULTS:fractureOptions(),original:finishInput.value==='original'&&!compare};
 }
 const runtimeKey=()=>JSON.stringify(runtimeSettings());
 const jobs=createMountainJobs(runBuild,(result,request)=>{
  requestedKey='';if(request.key!==runtimeKey())return;
  if(baseSeed!==request.seed){for(const g of previousBuffers.values())g.dispose();previousBuffers.clear();adjustedBuffer?.dispose();adjustedBuffer=null;adjustedKey='';baseSeed=request.seed;}
  baseGeometries=result.baseGeometries;
  stage.dataset.rockSeed=String(result.generation.seed);stage.dataset.baseMeshFingerprint=result.generation.fingerprint;
  if(geometryMode!==result.libraryKey){
   for(const g of Object.values(geometryCache))g.dispose();geometryCache={};activeGeometries=result.geometries;
   for(const [key,g]of Object.entries(activeGeometries))geometryCache[key]=rockBuffer(g);
   geometryMode=result.libraryKey;
  }
  generatedScene=result.scene;generatedKey=request.key;
  createScene(request.flags.resetCamera);
  if(pendingOrbit){yaw=pendingOrbit.yaw;pitch=pendingOrbit.pitch;pendingOrbit=null;render();}
  stage.setAttribute('aria-busy','false');detail.removeAttribute('role');
  if(request.flags.persist)save();
 },error=>{requestedKey='';stage.setAttribute('aria-busy','false');detail.textContent='Unable to generate this mountain. Change the seed or settings to retry.';detail.setAttribute('role','alert');console.error(error);});
 function requestBuild(resetCamera,persist){
  const settings=runtimeSettings(),key=JSON.stringify(settings);
  if(requestedKey===key){requestedFlags.resetCamera||=resetCamera;requestedFlags.persist||=persist;return;}
  requestedKey=key;requestedFlags={resetCamera,persist};
  stage.setAttribute('aria-busy','true');detail.textContent='Generating mountain rocks…';
  jobs.schedule({...settings,key,flags:requestedFlags,source:data.scenes[0]});
 }
 function cssColor(name){const probe=document.createElement('span');probe.style.color='var('+name+')';root.appendChild(probe);const value=getComputedStyle(probe).color;probe.remove();return new T.Color(value);}
 function palette(){
  const bg=cssColor('--background'),fg=cssColor('--foreground'),green=cssColor('--green'),blue=cssColor('--blue'),orange=cssColor('--orange');
  const dark=bg.r+bg.g+bg.b<fg.r+fg.g+fg.b;
  const bright=dark?fg:bg;
  ambient.color.copy(bright);ambient.groundColor.copy(bg.clone().lerp(fg,.2));sun.color.copy(bright);
  const stone=bg.clone().lerp(fg,dark?.31:.30).lerp(orange,.035);
  const ground=bg.clone().lerp(green,dark?.16:.11).lerp(fg,dark?.08:.05);
  const water=bg.clone().lerp(blue,dark?.26:.17);
  return {bg,fg,stone,ground,water,spine:orange,axis:blue,route:orange,river:blue,dark};
 }
 function mat(color,extra={}){const m=new T.MeshStandardMaterial({color,roughness:1,metalness:0,...extra});materials.push(m);return m;}
 function clearScene(){
  world.clear();guideGroup.clear();comparisonGroup.clear();comparisonMeshes=[];materials.forEach(m=>m.dispose());materials=[];
  terrainGeometry?.dispose();guideGeometries.forEach(g=>g.dispose());guideGeometries=[];labels.replaceChildren();
 }
 function setCamera(){
  const view=viewSelect.value;
  yaw=current.camera.yaw;pitch=current.camera.pitch;
  if(view==='plan'){yaw=0;pitch=Math.PI/2-.0001;}
  if(view==='side')yaw+=Math.PI/2;
  if(view==='low')pitch=.13;
  setCameraTarget();
 }
 function setCameraTarget(){
  target.fromArray(current.camera.target);span=current.camera.span;
  if(viewSelect.value!=='close')return;
  const r=current.rocks.find(r=>r.id===current.ridge?.primary.rock)||current.rocks[0],g=activeGeometries[r.mesh],b=g.bounds,c=Math.cos(r.yaw),s=Math.sin(r.yaw);
  const x=(b[0][0]+b[1][0])*.5*r.scale*(r.longitudinalScale??1),z=(b[0][2]+b[1][2])*.5*r.scale*(r.lateralScale??1),h=(b[1][1]-b[0][1])*r.scale*(r.verticalScale??1);
  target.set(r.x+c*x-s*z,r.y+(b[0][1]+b[1][1])*.5*r.scale*(r.verticalScale??1),r.z+s*x+c*z);
  span=Math.max(h*width/height,g.parameters.obbWidth*r.scale*(r.longitudinalScale??1))*1.18;
 }
 function createScene(resetCamera=true,persist=false){
  const key=runtimeKey();
  countsPanel.hidden=modeInput.value==='perlin';
  if(generatedKey!==key){requestBuild(resetCamera,persist);return false;}
  if(requestedKey){jobs.invalidate();requestedKey='';stage.setAttribute('aria-busy','false');}
  current=generatedScene;
  const perlin=modeInput.value==='perlin';
  root.querySelector('#rock-study-surface-legend').hidden=perlin&&surfaceInput.value!=='rocks';
  noiseControls.hidden=!perlin;surfaceControl.hidden=!perlin;
  ridgeLegend.hidden=!guideInput.checked;
  if(!perlin&&seededCounts.checked){peakCountInput.value=current.ridge.plan.topology.peaks;branchCountInput.value=current.ridge.plan.topology.spurs+current.ridge.plan.topology.forks;countLabels();}
  current=withSceneHeight(current,Number(heightInput.value)/100);
  heightValue.value=heightInput.value+'%';
  heightInput.setAttribute('aria-valuetext',heightInput.value+' percent of original height');
  clearScene();const p=palette();
  const compare=viewSelect.value==='compare';
  fractureLabels();for(const input of Object.values(fractureInputs))input.disabled=!compare&&(finishInput.value==='original'||(perlin&&surfaceInput.value!=='rocks'));
  ambient.intensity=!compare&&finishInput.value==='stone'?1.6:2.4;
  comparisonLabels.hidden=!compare;finishInput.disabled=compare;surfaceInput.disabled=compare;guideInput.disabled=compare;
  renderer.setClearColor(p.bg,0);
  const stone=mat(p.stone),terrain=mat(p.ground,{side:T.DoubleSide});
  if(compare){
   const r=current.rocks.find(r=>r.id===current.ridge?.primary.rock)||current.rocks[0],source=baseGeometries[r.mesh];
   if(!previousBuffers.has(r.mesh))previousBuffers.set(r.mesh,rockBuffer(previousFractureRockGeometry(source)));
   const key=r.mesh+':'+fractureKey();if(key!==adjustedKey){const next=rockBuffer(fractureRockGeometry(source,fractureOptions()));adjustedBuffer?.dispose();adjustedBuffer=next;adjustedKey=key;}
   const clay=mat(p.stone);
   comparisonMeshes=[previousBuffers.get(r.mesh),adjustedBuffer].map(geometry=>{
    const mesh=new T.Mesh(geometry,clay);mesh.position.set(r.x,r.y,r.z);mesh.scale.set(r.scale*(r.longitudinalScale??1),r.scale*(r.verticalScale??1),r.scale*(r.lateralScale??1));mesh.rotation.y=-r.yaw;mesh.castShadow=true;mesh.receiveShadow=true;comparisonGroup.add(mesh);mesh.updateMatrixWorld();return mesh;
   });
   comparisonCorners=[];for(let x=0;x<2;x++)for(let y=0;y<2;y++)for(let z=0;z<2;z++)comparisonCorners.push(new T.Vector3(source.bounds[x][0],source.bounds[y][1],source.bounds[z][2]).applyMatrix4(comparisonMeshes[0].matrixWorld));
   comparisonTarget.copy(comparisonCorners.reduce((sum,p)=>sum.add(p),new T.Vector3()).multiplyScalar(1/8));
  }
  if(finishInput.value==='stone')applyStoneSurface(stone,T,p.stone.clone().lerp(p.route,.22));
  if(!compare&&(!perlin||surfaceInput.value==='rocks'))for(const r of current.rocks){const rockMaterial=finishInput.value==='textured'?applyAtomicRockTexture(mat(p.stone),atomicRockTextures,atomicRockTileMeters(r,activeGeometries[r.mesh])):stone;const mesh=new T.Mesh(geometryCache[r.mesh],rockMaterial);mesh.position.set(r.x,r.y,r.z);mesh.scale.set(r.scale*(r.longitudinalScale??1),r.scale*(r.verticalScale??1),r.scale*(r.lateralScale??1));mesh.rotation.y=-r.yaw;mesh.castShadow=true;mesh.receiveShadow=true;world.add(mesh);}
  if(perlin&&surfaceInput.value!=='rocks'){
   const field=current.ridge.plan.sourceField,positions=field.positions.map((v,i)=>i%3===1?v+.04+(surfaceInput.value==='detail'?field.detailOffsets[(i-1)/3]:0):v);
   const geo=new T.BufferGeometry();geo.setAttribute('position',new T.Float32BufferAttribute(positions,3));geo.setIndex(field.indices);geo.computeVertexNormals();guideGeometries.push(geo);
   const mesh=new T.Mesh(geo,mat(p.stone,{side:T.DoubleSide}));mesh.castShadow=true;mesh.receiveShadow=true;world.add(mesh);
  }
  terrainGeometry=new T.BufferGeometry();terrainGeometry.setAttribute('position',new T.Float32BufferAttribute(current.terrain.positions,3));terrainGeometry.setIndex(current.terrain.indices);terrainGeometry.computeVertexNormals();
  const ground=new T.Mesh(terrainGeometry,terrain);ground.receiveShadow=true;world.add(ground);
  for(const guide of current.guides){
   if(perlin&&surfaceInput.value!=='rocks'&&guide.kind==='spine')continue;
   const points=guide.points.map(a=>new T.Vector3(...a));
   if(guide.kind==='spine'||guide.kind==='target'){
    const curve=new T.CurvePath();for(let i=1;i<points.length;i++)curve.add(new T.LineCurve3(points[i-1],points[i]));
    const isTarget=guide.kind==='target';
    const tube=new T.TubeGeometry(curve,Math.min(2000,points.length*3),isTarget?(guide.branch?.17:.22):.11,5,false);guideGeometries.push(tube);
    const color=isTarget?p.axis:p.spine;
    const ghostInk=new T.MeshBasicMaterial({color,depthTest:false,depthWrite:false,transparent:true,opacity:.24,toneMapped:false});materials.push(ghostInk);
    const ghost=new T.Mesh(tube,ghostInk);ghost.renderOrder=10;guideGroup.add(ghost);
    const ink=new T.MeshBasicMaterial({color,depthTest:true,depthWrite:false,toneMapped:false});materials.push(ink);
    const crest=new T.Mesh(tube,ink);crest.renderOrder=isTarget?12:11;guideGroup.add(crest);
   }else{
    const g=new T.BufferGeometry().setFromPoints(points);guideGeometries.push(g);
    const m=new T.LineBasicMaterial({color:guide.kind==='route'?p.route:p.river,depthTest:false,transparent:true,opacity:.85,toneMapped:false});materials.push(m);
    const line=new T.Line(g,m);line.renderOrder=10;guideGroup.add(line);
   }
   if(guide.width){const positions=[],indices=[];
    guide.points.forEach((p,i)=>{const a=guide.points[Math.max(0,i-1)],b=guide.points[Math.min(guide.points.length-1,i+1)],dx=b[0]-a[0],dz=b[2]-a[2],l=Math.hypot(dx,dz)||1;for(const side of [-1,1])positions.push(p[0]-side*dz/l*guide.width/2,p[1],p[2]+side*dx/l*guide.width/2);if(i){const j=(i-1)*2;indices.push(j,j+2,j+1,j+1,j+2,j+3);}});
    const ribbon=new T.BufferGeometry();ribbon.setAttribute('position',new T.Float32BufferAttribute(positions,3));ribbon.setIndex(indices);guideGeometries.push(ribbon);
    const rm=new T.MeshBasicMaterial({color:p.route,side:T.DoubleSide,transparent:true,opacity:.32,depthWrite:false});materials.push(rm);const strip=new T.Mesh(ribbon,rm);strip.renderOrder=9;guideGroup.add(strip);
   }
  }
  if(current.ridge?.stations?.length){
   const dots=new T.SphereGeometry(.52,10,8),saddleDot=new T.OctahedronGeometry(.65);guideGeometries.push(dots,saddleDot);
   const ink=new T.MeshBasicMaterial({color:p.axis,depthTest:true,depthWrite:false,toneMapped:false});materials.push(ink);
   for(const station of current.ridge.stations){
    if(!['peak','saddle'].includes(station.role))continue;
    const marker=new T.Mesh(station.role==='saddle'?saddleDot:dots,ink);marker.position.fromArray(station.target);marker.renderOrder=13;guideGroup.add(marker);
   }
  }
  current.labels.forEach(l=>{const el=document.createElement('span');el.className='rock-label text-small';el.textContent=l.text;labels.appendChild(el);});
  guideGroup.visible=guideInput.checked;labels.hidden=!guideInput.checked;
  const peakCount=current.ridge.plan.nodes.filter(n=>n.role==='peak').length,spurs=current.ridge.plan.nodes.filter(n=>n.role==='tail').length;
  const counted=(n,label)=>n+' '+label+(n===1?'':'s');
  detail.textContent=counted(peakCount,'peak')+' · '+counted(spurs,'spur')+' · '+current.ridge.composition.structuralMasses+' masses · '+counted(current.ridge.composition.smallRocks,'small rock');
  if(perlin){const n=current.ridge.plan.noise;noiseSummary.textContent=(100/n.frequency).toFixed(1)+' m base · '+n.coarseOctaves+' structural / '+n.fineOctaves+' detail octaves';}
  if(perlin&&surfaceInput.value!=='rocks'){const count=current.ridge.plan.extraction.selectedPeaks;detail.textContent=count+' major peak'+(count===1?'':'s')+' · '+current.ridge.plan.curves.length+' ridges · '+(surfaceInput.value==='coarse'?'Structural field':'Fine detail; same ridge network');}
  description.textContent=current.notes+' The blue branching ridge network guides broad overlapping rock masses. Whole masses are refitted before adding structure; local differences within '+current.ridge.policy.curveToleranceM.toFixed(1)+' meters are tolerated. Small rocks have a separate budget of two and stay at the lower edges. All accepted pieces overlap the connected body in sampled mesh volume. Orange shows the actual surface along each target curve; its measured RMS deviation is '+current.ridge.fit.rmsM.toFixed(2)+' meters. Spheres mark peaks and diamonds mark saddles.'+' Height scales rocks, terrain and the complete ridge network together. The mountain topology is generated at runtime from the seed before fitting the atomic rock meshes. Peak counts, connections, spurs and forks can change. Atomic recipes and meshes are generated from the current seed at runtime; the full Seed rendering pipeline is not integrated. Drag to orbit; side, plan and low angle views are also available.';
  if(perlin)description.textContent+=' Peaks and connecting saddle passes are extracted from a coarse Perlin field. Curves simplify and smooth the traced paths, so intermediate points may depart slightly from the sampled field. Octaves below 24 meters affect only bounded surface detail, not graph topology. The source field views hide the rock meshes and orange comparison lines.';
  if(finishInput.value==='textured')description.textContent+=' The atomic generator’s Marble Cliff 05 base color and normal maps use world-space triplanar projection. Each rock repeats over half its longest fitted OBB dimension, with the generator’s gray tint and 0.35 normal strength.';
  description.textContent+=finishInput.value==='original'?' Runtime atomic geometry without fracture carving, with clay shading.':' Continuous solid cuts carve long vertical fractures with uneven bends, asymmetric widths and tapered ends. Broad rock faces remain planar. Intersection edges define the cuts; the surface uses no vertex displacement or local backoff. The fitter measures those carved triangles. Clay shows the geometry without grain or color. Summit and bottom heights are preserved.';
  if(compare){detail.textContent='Same rock, size, camera and light · clay';description.textContent='The previous straight cuts and adjusted fractures on the same atomic rock. Fracture controls update the right-hand rock when released. Both use identical scale, camera, lighting and untextured clay. Drag either panel to rotate both together.';}
  stage.setAttribute('aria-describedby','rock-study-description');
  if(resetCamera)setCamera();else setCameraTarget();resize();if(persist)save();return true;
 }
 function render(){
  if(!current)return;
  const compare=viewSelect.value==='compare';world.visible=!compare;comparisonGroup.visible=compare;
  guideGroup.visible=!compare&&guideInput.checked;labels.hidden=compare||!guideInput.checked;ridgeLegend.hidden=compare||!current.ridge||!guideInput.checked;
  scaleBar.parentElement.hidden=compare;
  if(compare){renderComparison();return;}
  renderer.setScissorTest(false);renderer.setViewport(0,0,width,height);
  let maxX=0,maxY=0;
  const projectExtent=(x,y,z)=>{x-=target.x;y-=target.y;z-=target.z;maxX=Math.max(maxX,Math.abs(x*Math.cos(yaw)-z*Math.sin(yaw)));maxY=Math.max(maxY,Math.abs(-x*Math.sin(yaw)*Math.sin(pitch)+y*Math.cos(pitch)-z*Math.cos(yaw)*Math.sin(pitch)));};
  for(const r of current.rocks){const b=activeGeometries[r.mesh].bounds,c=Math.cos(r.yaw),sn=Math.sin(r.yaw);for(let i=0;i<2;i++)for(let j=0;j<2;j++)for(let k=0;k<2;k++){const x=b[i][0]*r.scale*(r.longitudinalScale??1),z=b[k][2]*r.scale*(r.lateralScale??1);projectExtent(r.x+c*x-sn*z,r.y+b[j][1]*r.scale*(r.verticalScale??1),r.z+sn*x+c*z);}}
  for(const l of current.labels)projectExtent(...l.position);
  for(const station of current.ridge?.stations||[])projectExtent(...station.target);
  const fit=viewSelect.value==='close'?span:Math.max(span,maxX*2.15,maxY*2.18*width/height);
  camera.left=-fit/2;camera.right=fit/2;camera.top=fit*height/width/2;camera.bottom=-camera.top;camera.updateProjectionMatrix();
  const distance=span*1.8;
  camera.position.set(target.x+distance*Math.sin(yaw)*Math.cos(pitch),target.y+distance*Math.sin(pitch),target.z+distance*Math.cos(yaw)*Math.cos(pitch));
  camera.lookAt(target);camera.updateMatrixWorld();renderer.render(scene,camera);
  const boxes=[];
  [...labels.children].forEach((el,i)=>{
   const point=new T.Vector3(...current.labels[i].position).project(camera);
   let x=(point.x*.5+.5)*width,y=(-point.y*.5+.5)*height;
   const w=el.offsetWidth,h=el.offsetHeight;
   x=Math.max(6,Math.min(width-w-6,x-w/2));y=Math.max(8,Math.min(height-h-30,y));
   const overlaps=boxes.some(b=>x<b.x+b.w&&x+w>b.x&&y<b.y+b.h&&y+h>b.y);
   el.hidden=overlaps||point.z>1||(viewSelect.value==='close'&&(Math.abs(point.x)>1||Math.abs(point.y)>1));el.style.left=x+'px';el.style.top=y+'px';if(!el.hidden)boxes.push({x,y,w,h});
  });
  scaleBar.style.width=(width*10/(camera.right-camera.left))+'px';
 }
 function renderComparison(){
  const stacked=width<540,panelW=stacked?width:Math.floor(width/2),panelH=stacked?Math.floor(height/2):height;
  comparisonLabels.classList.toggle('stacked',stacked);
  let xExtent=0,yExtent=0;for(const p of comparisonCorners){const x=p.x-comparisonTarget.x,y=p.y-comparisonTarget.y,z=p.z-comparisonTarget.z;xExtent=Math.max(xExtent,Math.abs(x*Math.cos(yaw)-z*Math.sin(yaw)));yExtent=Math.max(yExtent,Math.abs(-x*Math.sin(yaw)*Math.sin(pitch)+y*Math.cos(pitch)-z*Math.cos(yaw)*Math.sin(pitch)));}
  const fit=Math.max(xExtent*2.3,yExtent*2.4*panelW/panelH),distance=Math.max(40,fit*2);
  camera.left=-fit/2;camera.right=fit/2;camera.top=fit*panelH/panelW/2;camera.bottom=-camera.top;camera.updateProjectionMatrix();
  camera.position.set(comparisonTarget.x+distance*Math.sin(yaw)*Math.cos(pitch),comparisonTarget.y+distance*Math.sin(pitch),comparisonTarget.z+distance*Math.cos(yaw)*Math.cos(pitch));camera.lookAt(comparisonTarget);camera.updateMatrixWorld();
  renderer.setScissorTest(true);
  for(let i=0;i<2;i++){comparisonMeshes.forEach((mesh,j)=>mesh.visible=i===j);const x=stacked?0:i*panelW,y=stacked?(1-i)*panelH:0;renderer.setViewport(x,y,panelW,panelH);renderer.setScissor(x,y,panelW,panelH);renderer.render(scene,camera);}
  renderer.setScissorTest(false);
 }
 function resize(){width=stage.clientWidth||700;height=viewSelect.value==='compare'?(width<540?600:440):Math.max(280,Math.min(520,width*.64));if(current&&viewSelect.value==='close')setCameraTarget();renderer.setSize(width,height);stage.style.height=height+'px';camera.left=-span/2;camera.right=span/2;camera.top=span*height/width/2;camera.bottom=-camera.top;camera.updateProjectionMatrix();render();}
 function save(){if(!current||generatedKey!==runtimeKey())return;if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{demoPreset:DEMO_PRESET,surfacePresentation:ORIGINAL_ROCK_PRESENTATION,arrangement:current.id,view:viewSelect.value,showLayout:guideInput.checked,seed:Number(seedInput.value),heightPercent:Number(heightInput.value),ridgeMode:modeInput.value,topology:countOptions(),rockGeneration:RUNTIME_ROCK_VERSION,noise:noiseOptions(),surface:surfaceInput.value,rockFinish:finishInput.value,fractures:fractureOptions(),ridgeVersion:RIDGE_VERSION},privateContent:{yaw,pitch}}).catch(()=>{});}
 function applyState(state){const m=state?.modelContent;if(!m||![DEMO_PRESET,'island-425-fractures-145-v1'].includes(m.demoPreset))return false;if(['plan','low','perspective','side','close','compare'].includes(m.view))viewSelect.value=m.view;if(typeof m.showLayout==='boolean')guideInput.checked=m.showLayout;if(Number.isInteger(m.seed)&&m.seed>=0&&m.seed<=4294967295)seedInput.value=m.seed;if(Number.isFinite(m.heightPercent)&&m.heightPercent>=25&&m.heightPercent<=200)heightInput.value=m.heightPercent;if(['perlin','direct'].includes(m.ridgeMode))modeInput.value=m.ridgeMode;if(['rocks','coarse','detail'].includes(m.surface))surfaceInput.value=m.surface;try{const n=perlinSettings(m.noise);for(const key in noiseInputs)noiseInputs[key].value=n[key];}catch{}const f=fractureSettings(m.fractures);for(const key in fractureInputs)fractureInputs[key].value=f[key]*100;fractureLabels();const counts=mountainCounts(m.topology);seededCounts.checked=counts.seeded;peakCountInput.value=counts.peaks;branchCountInput.value=counts.branches;countLabels();return true;}
 function restoreState(state){
  const previous={view:viewSelect.value,seed:seedInput.value,height:heightInput.value,authoring:authoringKey(),counts:countKey(),surface:surfaceInput.value,finish:finishInput.value,fractures:fractureKey()};
  if(!applyState(state))return false;
  // Legacy arrangement states now open the mountain generator. Preserve their
  // seed, height, fracture/material settings and orbit, never their removed preset.
  const m=state.modelContent;
  finishInput.value=m.surfacePresentation===ORIGINAL_ROCK_PRESENTATION&&['textured','stone','clay','original'].includes(m.rockFinish)?m.rockFinish:'textured';
  const resetCamera=!current||previous.view!==viewSelect.value;
  const rebuild=!current||previous.seed!==seedInput.value||previous.height!==heightInput.value||previous.authoring!==authoringKey()||previous.counts!==countKey()||previous.surface!==surfaceInput.value||previous.finish!==finishInput.value||previous.fractures!==fractureKey()||(previous.view!==viewSelect.value&&[previous.view,viewSelect.value].includes('compare'));
  // A state echo after pointerup is persistence, not a request for a preset view.
  if(rebuild)createScene(resetCamera);else if(resetCamera)setCamera();
  const orbit=state.privateContent;
  if(!drag&&Number.isFinite(orbit?.yaw)&&Number.isFinite(orbit?.pitch)){
   yaw=orbit.yaw;pitch=Math.max(.08,Math.min(Math.PI/2-.0001,orbit.pitch));if(generatedKey!==runtimeKey())pendingOrbit={yaw,pitch};
  }
  guideGroup.visible=guideInput.checked;labels.hidden=!guideInput.checked;ridgeLegend.hidden=!current?.ridge||!guideInput.checked;render();
  return true;
 }
 function queueScene(resetCamera=false){fractureLabels();countLabels();createScene(resetCamera,true);}
 for(const input of [peakCountInput,branchCountInput]){
  input.addEventListener('input',()=>{seededCounts.checked=false;countLabels();});
  input.addEventListener('change',()=>queueScene(false));
 }
 seededCounts.addEventListener('change',()=>queueScene(false));
 for(const input of Object.values(fractureInputs)){
  input.addEventListener('input',fractureLabels);
  input.addEventListener('change',()=>queueScene(false));
 }
 let heightFrame;
 heightInput.addEventListener('input',()=>{heightValue.value=heightInput.value+'%';if(heightFrame)cancelAnimationFrame(heightFrame);heightFrame=requestAnimationFrame(()=>{heightFrame=0;createScene(false);});});
 heightInput.addEventListener('change',()=>{if(heightFrame){cancelAnimationFrame(heightFrame);heightFrame=0;createScene(false);}save();});
 seedInput.addEventListener('change',()=>{if(!seedInput.value||!seedInput.checkValidity())seedInput.value=DEFAULT_RIDGE_SEED;queueScene(false);});
 nextSeed.addEventListener('click',()=>{seedInput.value=(Number(seedInput.value)+1)>>>0;queueScene(false);});
 finishInput.addEventListener('change',()=>queueScene(false));
 for(const input of [modeInput,surfaceInput,...Object.values(noiseInputs)])input.addEventListener('change',()=>{for(const [key,field] of Object.entries(noiseInputs))if(!field.value||!field.checkValidity())field.value=PERLIN_DEFAULTS[key];queueScene(false);});
 viewSelect.addEventListener('change',()=>{pendingOrbit=null;queueScene(viewSelect.value!=='compare');});
 guideInput.addEventListener('change',()=>{guideGroup.visible=guideInput.checked;labels.hidden=!guideInput.checked;ridgeLegend.hidden=!current?.ridge||!guideInput.checked;render();save();});
 let drag;
 renderer.domElement.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,yaw,pitch};renderer.domElement.setPointerCapture(e.pointerId);});
 renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;yaw=drag.yaw-(e.clientX-drag.x)*.006;pitch=Math.max(.08,Math.min(Math.PI/2-.001,drag.pitch+(e.clientY-drag.y)*.006));render();});
 renderer.domElement.addEventListener('pointerup',()=>{if(drag){drag=null;save();}});
 renderer.domElement.addEventListener('pointercancel',()=>drag=null);
 new ResizeObserver(resize).observe(stage);
 let themeTimer;
 new MutationObserver(()=>{clearTimeout(themeTimer);themeTimer=setTimeout(()=>{const c=getComputedStyle(root).color+getComputedStyle(document.documentElement).getPropertyValue('--background');if(c!==lastColors){lastColors=c;createScene(false);}},50);}).observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});
 window.addEventListener('openai:set_globals',e=>{restoreState(e.detail?.globals?.widgetState);});
 if(!restoreState(window.openai?.widgetState))createScene();
})();
