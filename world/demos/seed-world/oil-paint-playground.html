<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galacean Oil Paint & Volumetric Light Playground</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #141210;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      #playground-canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      .pg-badge {
        position: fixed;
        top: 14px;
        left: 16px;
        z-index: 20;
        padding: 8px 14px;
        border-radius: 10px;
        background: rgba(24, 19, 16, 0.8);
        border: 1px solid rgba(255, 228, 176, 0.25);
        color: #ffecd0;
        font-size: 12px;
        line-height: 1.5;
        backdrop-filter: blur(8px);
        pointer-events: none;
      }
      .pg-badge strong {
        color: #f6ca73;
      }
    </style>
  </head>
  <body>
    <canvas id="playground-canvas"></canvas>
    <div class="pg-badge">
      <strong>Oil Paint & Volumetric Light Playground</strong><br />
      纯净测试台：地形 / 竖向树干 / 细小树叶面片 / 草叶 / 岩石 / 动物曲面 / 湖水<br />
      拖动鼠标旋转视角 · 滚轮缩放 · 左下角实时调优 & A/B 分屏对比
    </div>
    <script type="module" src="./src/oil-paint/OilPaintPlayground.ts"></script>
  </body>
</html>
