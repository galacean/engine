<!doctype html><meta charset="utf-8" /><title>Tiny Glade · 常驻渲染验收</title>
<style>
  body {
    background: #141c26;
    color: #e5ded2;
    font: 16px system-ui;
    padding: 20px;
  }
  canvas {
    width: 768px;
    height: 768px;
    background: #273540;
    image-rendering: auto;
  }
  pre {
    white-space: pre-wrap;
  }
  aside {
    position: absolute;
    left: 820px;
    top: 30px;
    width: 450px;
  }
</style>
<canvas id="scene" width="256" height="256"></canvas>
<aside>
  <h1>常驻渲染 · 隔离验收</h1>
  <p>原始模板网格 + 实例缓冲 + GPU 变形裁切</p>
  <select id="binding"></select
  ><button data-unit="roof_tile">瓦片</button><button data-unit="brick">砖块</button
  ><button data-unit="wooden_plank">木板</button><button id="local">局部改砖</button><button id="hide">局部隐藏</button
  ><button id="reset">恢复文档</button><button id="audit">像素对照（显式读回）</button>
  <pre id="audit-result"></pre>
  <pre id="metrics">载入中</pre>
</aside>
<script type="module">
  import { ResidentRenderer } from "/offline/CapturedResidentRenderer.js";
  try {
    const r = new ResidentRenderer(document.querySelector("canvas"));
    await r.load("/data/scene.json");
    window.resident = r;
    let documentDraft = structuredClone(r.scene.document);
    for (const b of documentDraft.bindings) {
      const o = document.createElement("option");
      o.value = b.id;
      o.textContent = b.id;
      document.querySelector("#binding").append(o);
    }
    const apply = () => {
      r.applyDocument(documentDraft);
      document.querySelector("#audit-result").textContent = JSON.stringify(r.metrics.lastEdit, null, 2);
    };
    for (const b of document.querySelectorAll("[data-unit]"))
      b.onclick = () => {
        documentDraft.bindings.find((b) => b.id === document.querySelector("#binding").value).unit_id = b.dataset.unit;
        apply();
      };
    for (const effect of ["local", "hide"])
      document.querySelector("#" + effect).onclick = () => {
        documentDraft.overrides.push({
          id: effect + documentDraft.overrides.length,
          binding_id: document.querySelector("#binding").value,
          region: {
            space: "surface_uv",
            polygon: [
              [2, 0.4],
              [4, 0.4],
              [4, 1.4],
              [2, 1.4]
            ]
          },
          effect: effect === "hide" ? { hidden: true } : { unit_id: "brick" }
        });
        apply();
      };
    document.querySelector("#reset").onclick = () => {
      documentDraft = structuredClone(r.scene.document);
      apply();
    };
    document.querySelector("#audit").onclick = async () => {
      const { audit } = await import("/audit.js");
      document.querySelector("#audit-result").textContent = JSON.stringify(await audit(r), null, 2);
    };
    setInterval(() => {
      document.querySelector("#metrics").textContent = JSON.stringify(r.metrics, null, 2);
    }, 500);
  } catch (e) {
    document.querySelector("#metrics").textContent = e.stack;
    console.error(e);
  }
</script>
