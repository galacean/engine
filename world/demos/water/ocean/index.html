<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ocean · 环岛海洋</title>
    <link rel="icon" href="data:," />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #103941;
        font-family: system-ui, sans-serif;
      }
      #canvas {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      .panel {
        position: fixed;
        left: 20px;
        top: 20px;
        max-width: calc(100% - 40px);
        padding: 16px 18px;
        color: #edf5f4;
        background: rgba(12, 35, 40, 0.82);
        border: 1px solid #ffffff20;
        border-radius: 10px;
      }
      .eyebrow {
        color: #95c5c5;
        font-size: 10px;
        letter-spacing: 0.18em;
      }
      h1 {
        margin: 5px 0 6px;
        font-size: 21px;
        font-weight: 600;
      }
      p {
        margin: 0;
        font-size: 12px;
        line-height: 1.6;
        color: #c3d8d7;
      }
      .views {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 14px;
      }
      button {
        font: inherit;
        font-size: 12px;
        padding: 7px 10px;
        border: 1px solid #ffffff30;
        border-radius: 5px;
        color: #dcecea;
        background: transparent;
        cursor: pointer;
      }
      button:hover,
      button:focus-visible {
        background: #ffffff20;
      }
      button[aria-pressed="true"] {
        background: #c3e5df;
        border-color: #c3e5df;
        color: #163c3b;
      }
      button:disabled {
        opacity: 0.45;
        cursor: wait;
      }
      .hint {
        position: fixed;
        bottom: max(16px, env(safe-area-inset-bottom));
        left: 20px;
        color: #eff8f7;
        background: #0c2328bb;
        padding: 8px 12px;
        border-radius: 6px;
        font-size: 11px;
      }
      #status {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        color: #edf5f4;
        background: #103941;
        font-size: 14px;
        z-index: 2;
      }
      #status[hidden] {
        display: none;
      }
      @media (max-width: 600px) {
        .panel {
          top: 12px;
          left: 12px;
          padding: 12px;
        }
        h1 {
          font-size: 18px;
        }
        .hint {
          left: 12px;
          right: 12px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" aria-label="环岛海洋三维场景"></canvas>
    <section class="panel" aria-label="海洋案例控制">
      <div class="eyebrow">WATER / OCEAN</div>
      <h1>环岛海洋</h1>
      <p>沙滩、浅海与开阔远洋</p>
      <nav class="views" aria-label="观察视角">
        <button data-view="island" aria-pressed="true" disabled>环岛全景</button>
        <button data-view="shore" aria-pressed="false" disabled>近岸浅水</button>
        <button data-view="horizon" aria-pressed="false" disabled>远海地平线</button>
        <button id="pause" aria-pressed="false" disabled>暂停海浪</button>
      </nav>
    </section>
    <div class="hint">点击画面 · WASD 移动 · Q/E 升降 · 拖动查看方向</div>
    <div id="status" role="status">正在准备岛屿与海洋…</div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
